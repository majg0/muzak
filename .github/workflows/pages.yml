name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - name: Cache Rust compiler artifacts and bridge tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen*
            target
          key: rust-1.97.1-wasm-bindgen-0.2.114-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install pinned Rust and Wasm bridge
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.97.1
          if ! wasm-bindgen --version | grep -q '^wasm-bindgen 0.2.114$'; then
            cargo install wasm-bindgen-cli --version 0.2.114 --locked --force
          fi
      - run: cargo test -p muzak-core
      - run: npm test
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build for the Pages URL
        run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"
      - name: Upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
