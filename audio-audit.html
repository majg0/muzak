<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Continuum · Audio verification</title
  ><style>
    body {
      font: 14px/1.7 system-ui;
      background: #17131f;
      color: #decee9;
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }
    button {
      padding: 12px 20px;
      background: #b99edb;
      color: #241630;
      border: 0;
      border-radius: 7px;
    }
    pre {
      white-space: pre-wrap;
      font-size: 12px;
      background: #21192c;
      padding: 20px;
      border-radius: 8px;
    }
    .sample {
      margin: 20px 0;
    }
    audio {
      display: block;
      width: 100%;
    }
    a {
      color: #cdb2e3;
    }
  </style>
  <h1>Continuum audio verification</h1>
  <p>
    Render the actual browser synthesis, check the waveform, and audition each
    passage. These measurements do not establish subjective musical quality.
  </p>
  <label
    >Sound
    <select id="audit-sound">
      <option value="baseline">12-TET ensemble</option>
      <option value="additive12">12-TET matched additive</option>
      <option value="additive19">19-EDO stretched additive</option>
    </select></label
  >
  <button id="run">Render three passages</button>
  <button id="pitch-proof">Verify native tuning playback</button>
  <button id="conformance">Verify event replay against Node fixtures</button>
  <button id="tempo-proof">Verify sustained notes across tempo changes</button>
  <button id="glide-proof">Verify pitch glides and instrument colors</button>
  <button id="form-proof">Render a complete autonomous form</button>
  <button id="lyrical-proof">Singing themes · hear a complete argument and its stems</button>
  <button id="expression-proof">Hear calm sweeps, rise, crest, and retreat</button>
  <button id="range-proof">Compare idea density × ensemble size</button>
  <button id="capability-proof">Render composition studies</button>
  <button id="melodic-intent-proof">Hear melodic gestures and verify legato</button>
  <button id="articulation-proof">Compare sustained and detached articulation</button>
  <button id="percussion-proof">Measure isolated kick, snare, and hat attacks</button>
  <p><label><input id="live-saved" type="checkbox" checked /> Use the saved performance for the live check (read-only)</label></p>
  <p><label><input id="live-fallback" type="checkbox" /> Verify Firefox-compatible envelope fallback for 35 seconds</label></p>
  <p><label><input id="live-crest" type="checkbox" /> Start the live check at the first dense crest</label></p>
  <button id="live-proof">Run live playback for 30 seconds</button>
  <button id="live-stop" disabled>Stop live check</button>
  <pre id="live-status">Live transport has not been checked.</pre>
  <div id="samples"></div>
  <pre id="result">Ready.</pre>
  <p><a href="./">Return to the instrument</a></p>
  <script type="module">
    import {
      auditAudio,
      audioSampleUrl,
      auditMicrotonalPitch,
      auditTempoBoundaries,
      auditGlidesAndTimbres,
      auditPercussionAttacks,
      auditArticulation,
    } from "./src/audio-audit.ts";
    import { DEFAULT_SOUND, SPECTRA } from "./src/spectrum.ts";
    import { runConformanceAsync } from "./src/conformance.ts";
    import { auditAutonomousForm } from "./src/form-audit.ts";
    import { auditLiveAudio } from "./src/live-audio-audit.ts";
    import { auditExpression } from "./src/expression-audit.ts";
    import { auditLyricalTheme } from "./src/lyrical-audit.ts";
    import { auditRange } from "./src/range-audit.ts";
    import { auditCapabilities } from "./src/capability-audit.ts";
    import { auditMelodicIntent } from "./src/melodic-intent-audit.ts";
    import { parsePerformance } from "./src/serialization.ts";
    function audition(label, buffer) {
      const div = document.createElement("div"); div.className = "sample";
      const title = document.createElement("strong"); title.textContent = label;
      const audio = document.createElement("audio"); audio.controls = true; audio.src = audioSampleUrl(buffer);
      audio.onplay = () => document.querySelectorAll("audio").forEach(other => { if (other !== audio) other.pause(); });
      div.append(title, audio); document.querySelector("#samples").append(div);
    }
    let liveController;
    document.querySelector('#melodic-intent-proof').onclick = async () => {
      const button = document.querySelector('#melodic-intent-proof'), result = document.querySelector('#result');
      button.disabled = true;
      document.querySelectorAll('audio').forEach(audio => audio.pause());
      document.querySelector('#samples').replaceChildren();
      try { result.textContent = JSON.stringify(await auditMelodicIntent({ onProgress: message => { result.textContent = message; }, onRendered: audition }), null, 2); }
      catch (error) { result.textContent = error.stack ?? String(error); }
      finally { button.disabled = false; }
    };
    document.querySelector('#capability-proof').onclick = async () => {
      const button = document.querySelector('#capability-proof'), result = document.querySelector('#result');
      button.disabled = true;
      document.querySelectorAll('audio').forEach(audio => audio.pause());
      document.querySelector('#samples').replaceChildren();
      try { result.textContent = JSON.stringify(await auditCapabilities({ onProgress: message => { result.textContent = message; }, onRendered: audition }), null, 2); }
      catch (error) { result.textContent = error.stack ?? String(error); }
      finally { button.disabled = false; }
    };
    document.querySelector('#range-proof').onclick = async () => {
      const button = document.querySelector('#range-proof'), result = document.querySelector('#result');
      button.disabled = true;
      document.querySelectorAll('audio').forEach(audio => audio.pause());
      document.querySelector('#samples').replaceChildren();
      try { result.textContent = JSON.stringify(await auditRange({ onProgress: message => { result.textContent = message; }, onRendered: audition }), null, 2); }
      catch (error) { result.textContent = error.stack ?? String(error); }
      finally { button.disabled = false; }
    };
    document.querySelector('#lyrical-proof').onclick = async () => {
      const button = document.querySelector('#lyrical-proof'), result = document.querySelector('#result');
      button.disabled = true;
      document.querySelectorAll('audio').forEach(audio => audio.pause());
      document.querySelector('#samples').replaceChildren();
      try { result.textContent = JSON.stringify(await auditLyricalTheme({ onProgress: message => { result.textContent = message; }, onRendered: audition }), null, 2); }
      catch (error) { result.textContent = error.stack ?? String(error); }
      finally { button.disabled = false; }
    };
    document.querySelector('#articulation-proof').onclick = async () => {
      const button = document.querySelector('#articulation-proof'), result = document.querySelector('#result');
      button.disabled = true;
      document.querySelectorAll('audio').forEach(audio => audio.pause());
      document.querySelector('#samples').replaceChildren();
      try { result.textContent = JSON.stringify(await auditArticulation({ onRendered: audition }), null, 2); }
      catch (error) { result.textContent = error.stack ?? String(error); }
      finally { button.disabled = false; }
    };
    document.querySelector('#expression-proof').onclick = async () => {
      const button = document.querySelector('#expression-proof'), result = document.querySelector('#result');
      button.disabled = true;
      document.querySelectorAll('audio').forEach(audio => audio.pause());
      document.querySelector('#samples').replaceChildren();
      try { result.textContent = JSON.stringify(await auditExpression({ onProgress: message => { result.textContent = message; }, onRendered: audition }), null, 2); }
      catch (error) { result.textContent = error.stack ?? String(error); }
      finally { button.disabled = false; }
    };
    document.querySelector("#live-stop").onclick = () => liveController?.abort();
    document.querySelector("#live-proof").onclick = async () => {
      const button = document.querySelector("#live-proof"), stop = document.querySelector("#live-stop");
      const status = document.querySelector("#live-status");
      button.disabled = true; stop.disabled = false; liveController = new AbortController();
      document.querySelectorAll("audio").forEach(audio => audio.pause());
      try {
        const saved = document.querySelector("#live-saved").checked ? localStorage.getItem("continuum.session") : null;
        const recipe = saved ? parsePerformance(saved) : undefined;
        const forceHoldFallback = document.querySelector("#live-fallback").checked;
        const durationSeconds = forceHoldFallback ? 35 : 30;
        document.querySelector("#result").textContent = "Running the actual audio transport. Keep this tab visible; the counter and measured signal below should keep advancing.";
        const report = await auditLiveAudio({ performance: recipe, durationSeconds, forceHoldFallback, signal: liveController.signal,
          startAt: document.querySelector('#live-crest').checked ? 'first-crest' : undefined,
          onPreparing: message => { status.textContent = message; }, onProgress: sample => {
          status.textContent = `${sample.elapsed.toFixed(1)} / ${durationSeconds} seconds · context ${sample.contextState} · playing ${sample.playing}${forceHoldFallback ? " · Firefox-compatible fallback" : ""}\nTick ${sample.currentTick} · ${sample.generatedFrames} generated / ${sample.audibleFrames} heard frames · ${sample.sourceCount} sources\nMeasured RMS ${sample.rms.toFixed(6)} · peak ${sample.peak.toFixed(6)} · planning ${sample.lastGenerationMs.toFixed(1)} ms\nRender clock ${sample.renderTime.toFixed(3)} · speaker clock ${sample.outputTime.toFixed(3)} · queued frames ${sample.queuedFrames}`;
        } });
        document.querySelector("#result").textContent = JSON.stringify(report, null, 2);
        status.textContent += `\n${report.aborted ? "Stopped by user" : report.passed ? "Live playback check passed" : "Live playback check failed"}${report.errors.length ? ` · ${report.errors.map(error => error.message).join("; ")}` : ""}`;
      } catch (error) {
        status.textContent = `Live check failed: ${error.message ?? String(error)}`;
        document.querySelector("#result").textContent = error.stack ?? String(error);
      } finally { button.disabled = false; stop.disabled = true; liveController = undefined; }
    };
    document.querySelector("#percussion-proof").onclick = async () => {
      const button = document.querySelector("#percussion-proof"); button.disabled = true;
      document.querySelector("#result").textContent = "Rendering isolated percussion attacks at equal velocity…";
      try { document.querySelector("#result").textContent = JSON.stringify(await auditPercussionAttacks({ onRendered: audition }), null, 2); }
      catch (error) { document.querySelector("#result").textContent = String(error); }
      finally { button.disabled = false; }
    };
    document.querySelector("#glide-proof").onclick = async () => {
      const button = document.querySelector("#glide-proof"); button.disabled = true;
      document.querySelector("#result").textContent = "Rendering pitch glides across tempo changes and nine instrument colors…";
      try { document.querySelector("#result").textContent = JSON.stringify(await auditGlidesAndTimbres({ onRendered: audition }), null, 2); }
      catch (error) { document.querySelector("#result").textContent = String(error); }
      finally { button.disabled = false; }
    };
    document.querySelector("#form-proof").onclick = async () => {
      const button = document.querySelector("#form-proof"); button.disabled = true;
      try {
        const report = await auditAutonomousForm({ onProgress: message => document.querySelector("#result").textContent = message, onRendered: buffer => audition("Autonomous form · opening, theme, answer, development, peak, rest, return", buffer) });
        document.querySelector("#result").textContent = JSON.stringify(report, null, 2);
      } catch (error) { document.querySelector("#result").textContent = String(error); }
      finally { button.disabled = false; }
    };
    document.querySelector("#tempo-proof").onclick = async () => {
      const button = document.querySelector("#tempo-proof");
      button.disabled = true;
      document.querySelector("#result").textContent = "Rendering accelerating and slowing tempo boundaries…";
      try {
        document.querySelector("#result").textContent = JSON.stringify(await auditTempoBoundaries(), null, 2);
      } catch (error) {
        document.querySelector("#result").textContent = String(error);
      } finally {
        button.disabled = false;
      }
    };
    document.querySelector("#conformance").onclick = async () => {
      const button = document.querySelector('#conformance'), result = document.querySelector('#result');
      button.disabled = true;
      result.textContent = 'Starting fixed-fixture event verification…';
      try {
        const report = await runConformanceAsync({ onProgress: progress => {
          result.textContent = `Verifying ${progress.caseIndex + 1}/${progress.caseCount} · ${progress.id} · ${progress.framesCompleted}/${progress.framesTotal} frames`;
        } });
        result.textContent = JSON.stringify(report, null, 2);
      } catch (error) { result.textContent = error.stack ?? String(error); }
      finally { button.disabled = false; }
    };
    document.querySelector("#pitch-proof").onclick = async () => {
      const button = document.querySelector("#pitch-proof");
      button.disabled = true;
      document.querySelector("#result").textContent =
        "Rendering native19/24/31-EDO notes and inspecting their spectra…";
      try {
        const reports = [];
        for (const tuning of ['19edo', '24edo', '31edo']) {
          document.querySelector('#result').textContent = `Rendering ${tuning} and measuring actual oscillator frequencies…`;
          reports.push(await auditMicrotonalPitch({ tuning }));
        }
        document.querySelector("#result").textContent = JSON.stringify(
          { passed: reports.every(report => report.passed), reports },
          null,
          2,
        );
      } catch (e) {
        document.querySelector("#result").textContent = String(e);
      } finally {
        button.disabled = false;
      }
    };
    document.querySelector("#run").onclick = async () => {
      const button = document.querySelector("#run");
      button.disabled = true;
      try {
        const report = await auditAudio({
          sound:
            document.querySelector("#audit-sound").value === "baseline"
              ? DEFAULT_SOUND
              : {
                  ...DEFAULT_SOUND,
                  instrument: "additive",
                  tuning:
                    document.querySelector("#audit-sound").value ===
                    "additive19"
                      ? "19edo"
                      : "12tet",
                  spectrum:
                    document.querySelector("#audit-sound").value ===
                    "additive19"
                      ? SPECTRA[1]
                      : SPECTRA[0],
                  roughnessWeight: 1,
                },
          onProgress: (id, stage, done, total) => {
            document.querySelector("#result").textContent =
              `${stage}: ${id} (${done}/${total})`;
          },
          onRendered: (id, buffer) => {
            const div = document.createElement("div");
            div.className = "sample";
            const name = document.createElement("strong");
            name.textContent = id;
            const audio = document.createElement("audio");
            audio.controls = true;
            audio.src = audioSampleUrl(buffer);
            div.append(name, audio);
            document.querySelector("#samples").append(div);
          },
        });
        document.querySelector("#result").textContent = JSON.stringify(
          report,
          null,
          2,
        );
      } catch (e) {
        document.querySelector("#result").textContent = String(e);
      } finally {
        button.disabled = false;
      }
    };
  </script>
</html>
